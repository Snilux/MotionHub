services:

  # ── Aplicación Astro (SSR + Node) ──────────────────────────
  app:
    build: .
    container_name: motionhub-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app                  # código local ↔ contenedor en vivo
      - /app/node_modules       # aísla node_modules del contenedor
      - uploads-data:/data/uploads   # archivos subidos (fotos de perfil, videos de ejercicios); persisten entre reinicios
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - UPLOADS_DIR=/data/uploads
      # La URL usa el nombre del servicio "mongo" como hostname
      - MONGODB_URI=mongodb://mongo:27017/motionhub
      - TZ=America/Mexico_City   # hora local para mostrar las citas
    depends_on:
      mongo:
        condition: service_healthy
    stdin_open: true
    tty: true                   # necesario para Claude Code interactivo

  # ── Recordatorios diarios ───────────────────────────────────
  # A las 7:00 (hora de México) pide a la app que envíe los recordatorios del día
  # (correo + notificación push). La app no repite envíos si se llama dos veces.
  # Probar sin enviar nada:
  #   docker compose exec cron sh -c 'wget -qO- --post-data= --header "Authorization: Bearer $$CRON_SECRET" "http://app:4321/api/cron/recordatorios?simular=1"'
  cron:
    image: busybox:1.36
    container_name: motionhub-cron
    env_file:
      - .env
    environment:
      - TZ=CST6   # México (UTC-6, sin horario de verano); no requiere tzdata
    command: >
      sh -c 'echo "0 7 * * * wget -qO- --post-data= --header \"Authorization: Bearer $$CRON_SECRET\" http://app:4321/api/cron/recordatorios >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
      && echo "cron listo: recordatorios diarios a las 07:00" && crond -f -l 8'
    depends_on:
      - app
    restart: unless-stopped

  # ── MongoDB 7 ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: motionhub-mongo
    ports:
      - "27017:27017"           # opcional: acceso con Compass desde tu PC
    volumes:
      - mongo-data:/data/db     # datos persisten entre reinicios
    environment:
      - MONGO_INITDB_DATABASE=motionhub
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads-data:
